<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="theme-color" content="#1262D0">
  <meta name="description" content="ArangCada LGU and TODA administration console.">
  <link rel="canonical" href="https://admin.arangcada.app/">

  <!-- Open Graph / Facebook / Messenger -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ArangCada Admin">
  <meta property="og:url" content="https://admin.arangcada.app/">
  <meta property="og:title" content="ArangCada Admin Console">
  <meta property="og:description" content="ArangCada LGU and TODA administration console for Calamba City tricycle dispatch and management.">
  <meta property="og:image" content="https://admin.arangcada.app/og-banner.png">
  <meta property="og:image:secure_url" content="https://admin.arangcada.app/og-banner.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="ArangCada Calamba Logo Banner">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://admin.arangcada.app/">
  <meta name="twitter:title" content="ArangCada Admin Console">
  <meta name="twitter:description" content="ArangCada LGU and TODA administration console for Calamba City tricycle dispatch and management.">
  <meta name="twitter:image" content="https://admin.arangcada.app/og-banner.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ArangCada Admin">
  <link rel="apple-touch-icon" href="icons/Icon-maskable-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <title>ArangCada Admin</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://unpkg.com/maplibre-gl@^5.24.0/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@^5.24.0/dist/maplibre-gl.css" rel="stylesheet">

  <!-- cropperjs -- image_cropper's web implementation wraps this JS
       library directly (package:image_cropper_for_web); it is not
       bundled by the Dart package itself and must be loaded here, per
       that package's own README (Web installation section). Without
       this, the crop dialog still opens (it is a plain Flutter
       AlertDialog) but the actual crop surface inside it has nothing to
       run on -- confirmed live, 9 Sep 2026. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
