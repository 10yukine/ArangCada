<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="theme-color" content="#1262D0">
  <meta name="description" content="ArangCada LGU and TODA administration console.">
  <link rel="canonical" href="https://admin.arangcada.app/">

  <!-- Open Graph / Facebook / Messenger -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ArangCada Admin">
  <meta property="og:url" content="https://admin.arangcada.app/">
  <meta property="og:title" content="ArangCada Admin Console">
  <meta property="og:description" content="ArangCada LGU and TODA administration console for Calamba City tricycle dispatch and management.">
  <meta property="og:image" content="https://admin.arangcada.app/og-banner.png">
  <meta property="og:image:secure_url" content="https://admin.arangcada.app/og-banner.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="ArangCada Calamba Logo Banner">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://admin.arangcada.app/">
  <meta name="twitter:title" content="ArangCada Admin Console">
  <meta name="twitter:description" content="ArangCada LGU and TODA administration console for Calamba City tricycle dispatch and management.">
  <meta name="twitter:image" content="https://admin.arangcada.app/og-banner.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Home Screen install opens full screen (no Safari toolbar). Flutter
       scrolls inside its own canvas, so Safari never collapses its bar in a tab. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ArangCada Admin">
  <link rel="apple-touch-icon" href="icons/Icon-maskable-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20260930">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=20260930">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=20260930">

  <title>ArangCada Admin</title>
  <link rel="manifest" href="manifest.json">
  <!-- Third-party scripts run with the signed-in admin's session, so each one
       is an exact version with a Subresource Integrity hash: a later publish
       to the CDN cannot change what this page runs. To upgrade, change the
       version and recompute the hash (sha384, base64) of the new file. -->
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js" integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp" crossorigin="anonymous"></script>
  <link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet" integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="anonymous">

  <!-- cropperjs -- image_cropper's web implementation wraps this JS
       library directly (package:image_cropper_for_web); it is not
       bundled by the Dart package itself and must be loaded here, per
       that package's own README (Web installation section). Without
       this, the crop dialog still opens (it is a plain Flutter
       AlertDialog) but the actual crop surface inside it has nothing to
       run on -- confirmed live, 9 Sep 2026. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.css" integrity="sha384-msRo/DUqciLiajfTHR4aynPm/OyeCwjTio3llAz/9Ajeq4fDBmSiNL1QDum77PDK" crossorigin="anonymous" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js" integrity="sha384-jrOgQzBlDeUNdmQn3rUt/PZD+pdcRBdWd/HWRqRo+n2OR2QtGyjSaJC0GiCeH+ir" crossorigin="anonymous"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
