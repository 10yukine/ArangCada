
[functions.dispatch_fcm]
enabled = true
verify_jwt = false
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/dispatch_fcm/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/dispatch_fcm/*.html" ]

# List deployed Edge Functions explicitly for the GitHub integration.

[functions.send-sms-hook]
enabled = true
# MUST stay false. Supabase Auth calls this hook itself and authenticates with
# a Standard Webhooks signature, not a user JWT. With verify_jwt = true the
# platform gateway would reject GoTrue's request before the function ran, and
# every registration would fail at the OTP step.
#
# It is not unauthenticated: verifySignature() rejects anything not signed with
# SEND_SMS_HOOK_SECRET. Verified against the live endpoint -- an unsigned POST
# returns 401 invalid signature.
verify_jwt = false
entrypoint = "./functions/send-sms-hook/index.ts"

[functions.admin-onboard-driver]
enabled = true
# True, unlike the hook above. This one is called from apps/admin_web with a
# signed-in administrator's session, so the gateway can reject anonymous callers
# before any of our code runs. The function still does its own check -- it reads
# the Authorization header, resolves the caller with auth.getUser() and confirms
# the admin role -- because the gateway only proves the JWT is valid, not that
# it belongs to an administrator. This is defence in depth, not a substitute.
verify_jwt = true
entrypoint = "./functions/admin-onboard-driver/index.ts"

[functions.send-admin-invite]
enabled = true
# True -- called from apps/admin_web with a signed-in LGU administrator's
# session, same reasoning as admin-onboard-driver above.
verify_jwt = true
entrypoint = "./functions/send-admin-invite/index.ts"

[functions.accept-admin-invite]
enabled = true
# MUST stay false. The recipient of an invite has no ArangCada session at
# all -- the token in the link is the only credential, checked inside the
# function itself (admin_invite_lookup / admin_finalize_invited_account).
# With verify_jwt = true the gateway would reject every legitimate call
# before the function ever ran.
verify_jwt = false
entrypoint = "./functions/accept-admin-invite/index.ts"

[functions.send-driver-invite]
enabled = true
# True -- called from apps/admin_web with a signed-in LGU administrator's
# session, same reasoning as send-admin-invite.
verify_jwt = true
entrypoint = "./functions/send-driver-invite/index.ts"

[functions.accept-driver-invite]
enabled = true
# MUST stay false. The invited driver has no ArangCada session at all --
# the token in the link is the only credential, checked inside the
# function itself (driver_invite_lookup / driver_finalize_invited_account).
verify_jwt = false
entrypoint = "./functions/accept-driver-invite/index.ts"

[functions.inbound-email]
enabled = true
# MUST stay false. Resend calls this webhook with a Svix signature, not a user
# JWT; the gateway would reject every delivery. Not unauthenticated:
# verifySignature() rejects anything not signed with
# RESEND_INBOUND_WEBHOOK_SECRET.
verify_jwt = false
entrypoint = "./functions/inbound-email/index.ts"

[functions.account-deletion]
enabled = true
# MUST stay false: arangcada.app/delete-account calls it with no session.
# Not unauthenticated: it signs in with the password sent in the body and
# deletes only that account (see functions/account-deletion/delete.ts).
verify_jwt = false
entrypoint = "./functions/account-deletion/index.ts"

[functions.place-search]
enabled = true
# True -- called from the mobile app with a signed-in rider's session. The
# function counts each search against that account (consume_place_search), so
# the gateway must reject callers without a JWT.
verify_jwt = true

[functions.send-email-confirmation]
enabled = true
# True -- called from the mobile app with a signed-in session. The function
# asks Supabase Auth who the caller is and mails the link to that account's
# own address, so the gateway must reject callers without a JWT.
verify_jwt = true

[functions.confirm-email]
enabled = true
# MUST stay false: arangcada.app/confirm-email calls it with no session. The
# person opening the email may not be signed in on that device, so the
# single-use token in the link is the only credential, checked inside the
# function.
verify_jwt = false
